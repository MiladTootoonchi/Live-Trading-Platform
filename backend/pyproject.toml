[project]
name = "live-trading-platform"
version = "0.3.1"
description = "Creating new solutions based on the Alpaca platform that can help traders make better-informed decisions and execute trades more efficiently."
readme = "README.md"
requires-python = ">=3.11,<3.12"

authors = [
  { name = "Milad Tootoonchi", email = "milad.tootoonchi04@gmail.com" }
]

dependencies = [
  "alpaca_trade_api",
  "alpaca-py",
  "numpy",
  "pandas",
  "requests",
  "python-dotenv",
  "toml",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "scipy",
  "tensorflow",
  "scikeras",
  "notebook",
  "ipykernel",
  "xgboost>=3.1.3,<4.0.0",
  "lightgbm>=4.6.0,<5.0.0",
  "joblib>=1.5.3,<2.0.0",
  "catboost>=1.2.8,<2.0.0",
  "tenacity>=9.1.2,<10.0.0",
  "fastapi>=0.136.3",
  "uvicorn>=0.48.0",
]

[project.scripts]
trade = "live_trader.trade:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_trader"]

[dependency-groups]
dev = [
  # "pytest",
  # "black",
  # "ruff",
]
